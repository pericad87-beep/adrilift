<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <title>AdriLift</title>
  <style>
    :root{
      --bg:#070a10; --card:#101824; --card2:#141f2d;
      --text:#f4f7fb; --muted:#9caec3; --muted2:#6d7f95; --line:rgba(255,255,255,.09);
      --accent:#62a7ff; --accent2:#8b5cf6; --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --cyan:#22d3ee;
      --shadow:0 18px 55px rgba(0,0,0,.42); --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0; padding:0; min-height:100vh; color:var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(98,167,255,.18), transparent 30%),
        radial-gradient(circle at 90% 5%, rgba(139,92,246,.18), transparent 28%),
        linear-gradient(180deg,#05070b,#0a1018 45%,#070a10);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    body:before{
      content:""; position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image:linear-gradient(180deg,rgba(0,0,0,.75),transparent 70%);
    }
    .app{max-width:1120px;margin:0 auto;padding:14px 14px 120px}
    .topbar{
      position:sticky; top:0; z-index:50; margin:-14px -14px 16px; padding:14px;
      backdrop-filter:blur(18px); background:rgba(5,8,13,.76); border-bottom:1px solid var(--line);
    }
    .brand{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .logo-wrap{display:flex;align-items:center;gap:12px}
    .logo{
      width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid;place-items:center;box-shadow:0 14px 35px rgba(98,167,255,.22);font-size:24px
    }
    .title{font-size:31px;font-weight:950;letter-spacing:-.5px}
    .subtitle{font-size:13px;color:var(--muted);margin-top:2px}
    .chip{
      border:1px solid var(--line);border-radius:999px;padding:10px 13px;font-weight:900;color:white;
      background:linear-gradient(135deg,rgba(98,167,255,.20),rgba(139,92,246,.18));white-space:nowrap
    }
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
    .nav button{
      border:1px solid transparent;background:rgba(18,28,42,.78);color:var(--muted);
      padding:12px 8px;border-radius:16px;font-weight:950;cursor:pointer
    }
    .nav button.active{
      color:white;background:linear-gradient(180deg,rgba(98,167,255,.22),rgba(139,92,246,.14));
      border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
    }
    .screen{display:none}.screen.active{display:block}
    .hero{
      position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:32px;padding:20px;
      box-shadow:var(--shadow);
      background:
        radial-gradient(circle at top left,rgba(98,167,255,.25),transparent 35%),
        radial-gradient(circle at bottom right,rgba(139,92,246,.22),transparent 30%),
        linear-gradient(180deg,rgba(20,31,45,.94),rgba(12,18,27,.94));
      margin-bottom:14px
    }
    .hero-title{font-size:28px;font-weight:950;letter-spacing:-.6px}
    .hero-text{font-size:14px;line-height:1.55;color:var(--muted);margin-top:8px;max-width:860px}
    .card{
      background:linear-gradient(180deg,rgba(16,24,36,.96),rgba(13,20,31,.96));
      border:1px solid rgba(255,255,255,.075);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)
    }
    .grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}
    @media(max-width:760px){.grid.two,.grid.three{grid-template-columns:1fr}}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.space{justify-content:space-between}
    .stack{display:flex;flex-direction:column;gap:10px}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}
    h3{margin:0 0 10px;font-size:18px} h4{margin:0}
    .label{font-size:12px;color:var(--muted);font-weight:950;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
    input,select,textarea{
      width:100%;background:#0b1119;color:var(--text);border:1px solid rgba(255,255,255,.09);
      border-radius:15px;padding:12px;outline:none;font-size:14px
    }
    textarea{min-height:78px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:rgba(98,167,255,.65);box-shadow:0 0 0 3px rgba(98,167,255,.10)}
    button{border:none;border-radius:15px;padding:12px 14px;font-weight:950;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
    button:active{transform:scale(.98)}
    .btn{background:#1d2938;color:white}.btn-outline{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.11)}
    .btn-accent{background:linear-gradient(135deg,var(--accent),#4f8bf0);color:white}
    .btn-purple{background:linear-gradient(135deg,var(--accent2),#6d4de8);color:white}
    .btn-green{background:linear-gradient(135deg,var(--green),#16a34a);color:white}
    .btn-orange{background:linear-gradient(135deg,var(--orange),#d97706);color:white}
    .btn-red{background:linear-gradient(135deg,var(--red),#dc2626);color:white}.btn-small{padding:8px 10px;border-radius:12px;font-size:12px}
    .badge{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:950;
      color:var(--muted);background:rgba(10,15,23,.84);border:1px solid rgba(255,255,255,.09)
    }
    .pill-green{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.28);color:#baf7ce}
    .pill-orange{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.28);color:#ffe1ad}
    .pill-blue{background:rgba(98,167,255,.12);border-color:rgba(98,167,255,.28);color:#c9e3ff}
    .pill-red{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.28);color:#ffc4c4}
    .progress{height:11px;border-radius:999px;background:#0a1017;border:1px solid rgba(255,255,255,.08);overflow:hidden}
    .progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--cyan))}
    .workout-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    @media(max-width:900px){.workout-cards{grid-template-columns:repeat(2,1fr)}} @media(max-width:520px){.workout-cards{grid-template-columns:1fr}}
    .workout-card{
      padding:15px;border-radius:22px;border:1px solid rgba(255,255,255,.075);
      background:radial-gradient(circle at 0% 0%,rgba(98,167,255,.10),transparent 38%),linear-gradient(180deg,#111a27,#0d141e);
      min-height:160px
    }
    .workout-card.active{outline:2px solid rgba(98,167,255,.45)}.workout-card.done{border-color:rgba(34,197,94,.30)}
    .big-number{font-size:38px;font-weight:950;letter-spacing:-1px}.metric{padding:14px;border-radius:20px;background:rgba(9,14,22,.6);border:1px solid rgba(255,255,255,.07)}
    .exercise{
      border:1px solid rgba(255,255,255,.13);
      background:radial-gradient(circle at top right,rgba(139,92,246,.10),transparent 35%),linear-gradient(180deg,#111a26,#0d141e);
      border-radius:26px;padding:16px;margin-top:18px;box-shadow:0 14px 38px rgba(0,0,0,.30)
    }
    .exercise:nth-child(odd){border-color:rgba(98,167,255,.14)}
    .exercise-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
    .exercise-title{font-size:18px;font-weight:950}
    .focus-box{
      margin-top:10px;padding:12px;border-radius:18px;background:rgba(8,13,20,.56);
      border:1px solid rgba(98,167,255,.14)
    }
    .sets-wrap{margin-top:12px;border-radius:20px;background:rgba(5,9,14,.30);padding:10px;border:1px solid rgba(255,255,255,.06)}
    .set-row{
      display:grid;grid-template-columns:78px 88px 88px 110px 1fr auto;gap:8px;align-items:start;
      margin-bottom:10px;padding:10px;border-radius:18px;background:rgba(12,18,27,.72);border:1px solid rgba(255,255,255,.08)
    }
    @media(max-width:930px){
      .set-row{grid-template-columns:70px 1fr 1fr}
      .set-target,.set-type,.set-actions{grid-column:1/-1}
    }
    .set-label{padding:11px 8px;border-radius:14px;background:rgba(8,13,20,.76);border:1px solid rgba(255,255,255,.08);text-align:center;font-weight:950}
    .set-label.top{background:rgba(98,167,255,.13);border-color:rgba(98,167,255,.26);color:#d8ecff}
    .set-label.back{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.24);color:#eadcff}
    .set-target,.set-type{padding:10px 11px;border-radius:14px;background:rgba(8,13,20,.56);border:1px solid rgba(255,255,255,.07)}
    .diff{font-size:12px;color:var(--muted2);margin-top:3px}.divider{height:1px;background:rgba(255,255,255,.07);margin:13px 0}
    .footer-note{text-align:center;color:var(--muted2);font-size:12px;margin-top:18px}
    .danger-zone{border:1px solid rgba(239,68,68,.26);background:rgba(127,29,29,.10);border-radius:20px;padding:14px}
    .hint{font-size:12px;color:var(--muted);line-height:1.45}.empty{padding:22px;text-align:center;color:var(--muted)}
    .alt-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    @media(max-width:720px){.alt-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const STORAGE_KEY = "adrilift_rotation_v4";

const DEFAULT_TRAININGS = [
  { id:1, name:"Grudi / Biceps", short:"Chest + Biceps", exercises:[
    {name:"Incline Smith Press", focus:"gornja grudi + snaga", setType:"top-backoff", supersetWith:"", targetMin:6,targetMax:8,backoffMin:8,backoffMax:10,backoffPercent:12,sets:4,note:"Spuštaj ka gornjem delu grudi. Hvat malo šire od ramena. Laktovi blago u stranu, ne previše rašireni. Grudi drži podignute, ramena nazad. Top set je najteža serija, back off je lakši i kontrolisan.", alternatives:["Incline DB Press"]},
    {name:"Machine Chest Press (ravno)", focus:"srednja grudi", setType:"normal", supersetWith:"", targetMin:8,targetMax:10,sets:3,note:"Sedi stabilno i drži lopatice nazad. Hvataj ručke simetrično, laktovi blago ispod linije ramena. Guraj ravno napred, ne zaključavaj laktove na vrhu. Kontroliši negativni deo.", alternatives:["Flat DB Press"]},
    {name:"Incline Fly", focus:"gornja grudi – istezanje", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Radi kontrolisano. Laktovi blago savijeni i fiksirani. Otvaraj ruke dok ne osetiš istezanje u grudima, pa vraćaj bez jakog sudaranja ručki. Fokus je istezanje gornjih grudi.", alternatives:["Cable Fly Low To High"]},
    {name:"Preacher Curl", focus:"biceps", setType:"normal", supersetWith:"", targetMin:8,targetMax:10,sets:3,note:"Nadlaktica ostaje fiksirana na klupi. Ne diži ramena. Spuštaj sporo i kontroliši donji deo pokreta. Fokus na biceps, bez cimanja telom.", alternatives:["Machine Curl"]},
    {name:"Hammer Curl", focus:"brachialis + podlaktica", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Neutral hvat, dlanovi gledaju jedan ka drugom. Laktovi uz telo i mirni. Ne ljuljaj telo. Diži kontrolisano i spuštaj sporo.", alternatives:["Rope Hammer Curl"]}
  ]},
  { id:2, name:"Leđa / Triceps", short:"Back A + Triceps", exercises:[
    {name:"Barbell Row", focus:"gornja leđa – debljina", setType:"top-backoff", supersetWith:"", targetMin:6,targetMax:8,backoffMin:8,backoffMax:10,backoffPercent:12,sets:4,note:"Vučeš šipku ka donjem stomaku. Hvat običan overhand, malo šire od širine ramena. Laktovi blago u stranu, ne skroz uz telo. Leđa ravna, trup stabilan. Skupljaj lopatice na kraju pokreta, bez cimanja.", alternatives:["Smith Row"]},
    {name:"Lat Pulldown (uski/neutral)", focus:"lat – širina", setType:"normal", supersetWith:"", targetMin:8,targetMax:10,sets:3,note:"Koristi uski ili neutral hvat. Vučeš ka gornjim grudima. Laktovi idu dole i uz telo. Ne vuci iza glave. Ne cimaj leđima, fokus da laktove spuštaš ka kukovima.", alternatives:["Pull Up"]},
    {name:"Chest Supported Row", focus:"gornja leđa", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Grudi ostaju naslonjene. Vučeš ka sredini stomaka. Laktovi blago šire da pogodiš gornja leđa. Skupljaj lopatice i ne cimaj telom.", alternatives:["Machine Row"]},
    {name:"Skull Crusher", focus:"triceps – duga glava", setType:"normal", supersetWith:"", targetMin:8,targetMax:10,sets:3,note:"Koristi EZ šipku. Laktovi ostaju mirni i usmereni gore. Spuštaj kontrolisano ka čelu ili malo iza čela. Ne širi laktove previše.", alternatives:["EZ Overhead Extension"]},
    {name:"Cable Pushdown", focus:"triceps", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Laktovi su uz telo i mirni. Ramena ne pomeraj. Guraj sajlu dole do punog opružanja i jako stisni triceps na kraju.", alternatives:["Rope Pushdown"]},
    {name:"Single Arm Cable Pushdown (neutral hvat)", focus:"triceps – kontrola", setType:"normal", supersetWith:"", targetMin:12,targetMax:15,sets:2,note:"Jednoručno na sajli, neutral hvat. Lakat uz telo i fiksiran. Guraj dole kontrolisano, bez rotiranja ramena. Fokus na čist završetak pokreta.", alternatives:["Reverse Single Arm Pushdown"]}
  ]},
  { id:3, name:"Ramena / Trap", short:"Shoulders", exercises:[
    {name:"Lateral Raise Machine", focus:"side delt – širina ramena", setType:"normal", supersetWith:"", targetMin:12,targetMax:15,sets:4,note:"Prioritet za side delt. Sedi/stoj stabilno. Laktovi blago savijeni. Diži do visine ramena, bez zamaha. Kontrola na vrhu i spor negativ.", alternatives:["Cable Lateral Raise"]},
    {name:"Shoulder Press Machine", focus:"prednje rame + side delt", setType:"top-backoff", supersetWith:"", targetMin:6,targetMax:8,backoffMin:8,backoffMax:10,backoffPercent:10,sets:4,note:"Sedi stabilno, leđa naslonjena. Hvat prirodan, malo šire od ramena. Spuštaj do nivoa gde rame ne smeta. Ne zaključavaj laktove. Top set težak, back off kontrolisan.", alternatives:["DB Shoulder Press"]},
    {name:"Face Pull", focus:"zadnje rame", setType:"normal", supersetWith:"", targetMin:12,targetMax:15,sets:3,note:"Povlači sajlu ka licu. Laktovi visoko i blago u stranu. Na kraju pokreta razdvoji šake i stisni zadnje rame. Ne vuci donjim leđima.", alternatives:["Reverse Pec Deck"]},
    {name:"Cable Lateral Raise", focus:"side delt izolacija", setType:"normal", supersetWith:"", targetMin:12,targetMax:15,sets:3,note:"Sajla treba da vuče iz donje pozicije. Lakat blago savijen. Diži rukom u stranu do visine ramena. Sporo, bez trzanja i bez rotiranja tela.", alternatives:["DB Lateral Raise"]},
    {name:"Shrugs", focus:"trapez", setType:"normal", supersetWith:"", targetMin:10,targetMax:15,sets:3,note:"Hvataj bučice, šipku ili mašinu čvrsto. Pokret je samo gore-dole, bez kruženja ramenima. Zadrži sekundu gore i spusti kontrolisano.", alternatives:["Smith Shrugs"]}
  ]},
  { id:4, name:"Grudi / Leđa", short:"Chest + Back B", exercises:[
    {name:"Incline Dumbbell Press", focus:"gornja grudi", setType:"top-backoff", supersetWith:"", targetMin:6,targetMax:8,backoffMin:8,backoffMax:10,backoffPercent:12,sets:4,note:"Klupa pod blagim incline uglom. Spuštaj bučice kontrolisano do istezanja u gornjim grudima. Laktovi blago u stranu. Ne sudaraj bučice na vrhu i ne zaključavaj laktove.", alternatives:["Incline Smith Press"]},
    {name:"T-Bar Row (uski hvat)", focus:"mix – gornja leđa + lat", setType:"top-backoff", supersetWith:"", targetMin:6,targetMax:8,backoffMin:8,backoffMax:10,backoffPercent:12,sets:4,note:"Uski V hvat. Vučeš ka stomaku. Laktovi idu uz telo, ali na kraju svesno stisni lopatice. Trup stabilan, bez cimanja. Fokus je mix gornja leđa + lat.", alternatives:["Landmine Row"]},
    {name:"Incline Machine Press", focus:"gornja grudi", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Sedi stabilno i drži lopatice nazad. Guraj pod uglom za gornje grudi. Laktovi blago u stranu. Spor negativ i jak stisak u gornjoj poziciji.", alternatives:["Incline Cable Press"]},
    {name:"Seated Cable Row (lat varijanta)", focus:"lat", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Koristi uži ili neutral hvat. Vučeš ka donjem stomaku/kukovima. Laktovi idu uz telo. Malo se nagni nazad, ali bez cimanja. Fokus je lat, kao da vučeš laktove dole.", alternatives:["One Arm Cable Row"]},
    {name:"Flat Machine Fly", focus:"srednja grudi – istezanje", setType:"normal", supersetWith:"", targetMin:12,targetMax:15,sets:3,note:"Sedi stabilno. Laktovi blago savijeni i fiksirani. Otvaraj do prijatnog istezanja u srednjim grudima. Vraćaj kontrolisano, bez jakog sudaranja ručki.", alternatives:["Pec Deck"]},
    {name:"Wide Grip Cable Row", focus:"gornja leđa", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:3,note:"Širok hvat na sajli/mašini. Vučeš ka grudima ili gornjem stomaku. Laktovi idu šire u stranu. Skupljaj lopatice na kraju pokreta. Fokus je gornji deo leđa.", alternatives:["Wide Machine Row"]}
  ]},
  { id:5, name:"Noge + Superset", short:"Legs + Pump", exercises:[
    {name:"Leg Extension", focus:"kvadriceps", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:4,note:"Sedi tako da koleno prati osu mašine. Stopala ispod rolera. Ispruži noge kontrolisano, zadrži sekundu gore i spuštaj sporo. Fokus kvadriceps.", alternatives:["Single Leg Extension"]},
    {name:"Leg Curl", focus:"zadnja loža", setType:"normal", supersetWith:"", targetMin:10,targetMax:12,sets:4,note:"Podesi roler da lepo leži iznad pete/zadnjeg dela skočnog zgloba. Kukovi ostaju dole. Savij noge kontrolisano i spuštaj sporo. Fokus zadnja loža.", alternatives:["Seated Leg Curl"]},
    {name:"Leg Press", focus:"cela noga – kvadriceps dominant", setType:"top-backoff", supersetWith:"", targetMin:8,targetMax:10,backoffMin:10,backoffMax:12,backoffPercent:12,sets:4,note:"Glavna teža vežba za noge. Stopala stabilna na platformi, malo šire od kukova. Spuštaj kontrolisano do pune dubine bez odvajanja kukova. Guraj kroz celo stopalo. Top set 8-10, back off 10-12.", alternatives:["Hack Press Machine"]},
    {name:"Lateral Raise", focus:"side delt – superset", setType:"superset", supersetWith:"Cable Curl", targetMin:12,targetMax:15,sets:3,note:"Lagano, pump na kraju treninga. Laktovi blago savijeni. Diži do visine ramena bez zamaha. Radi u supersetu.", alternatives:["Cable Lateral Raise"]},
    {name:"Cable Curl", focus:"biceps – superset", setType:"superset", supersetWith:"Rope Pushdown", targetMin:10,targetMax:12,sets:3,note:"Kontrola i pump. Laktovi mirni, ne ljuljaj telo. Povuci sajlu ka gore i stisni biceps. Radi u supersetu.", alternatives:["Preacher Curl"]},
    {name:"Rope Pushdown", focus:"triceps – superset", setType:"superset", supersetWith:"Lateral Raise", targetMin:10,targetMax:12,sets:3,note:"Laktovi uz telo. Guraj konopac dole i na kraju blago razdvoji krajeve. Pun završetak i kontrola. Radi u supersetu.", alternatives:["Single Arm Pushdown"]}
  ]}
];

function uid(){return Math.random().toString(36).slice(2,10)}
function safeNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
function roundKg(n){return Math.round(n*2)/2}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function initialState(){return {appName:"AdriLift",currentScreen:"dashboard",currentTraining:1,currentCycle:1,sessions:{},settings:{autoBackoff:true}}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?normalize(JSON.parse(raw)):initialState()}catch(e){return initialState()}}
function normalize(s){const x={...initialState(),...s}; if(!x.sessions||typeof x.sessions!=="object")x.sessions={}; if(!x.settings)x.settings={autoBackoff:true}; return x}
let state=load()
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function sessionKey(c=state.currentCycle,t=state.currentTraining){return `C${c}_T${t}`}
function findPreviousSession(trainingId,beforeCycle=state.currentCycle){for(let c=beforeCycle-1;c>=1;c--){const s=state.sessions[`C${c}_T${trainingId}`]; if(s)return s} return null}
function makeSet(kind,min,max,prev){return {reps:prev?.reps??"",weight:prev?.weight??"",kind:prev?.kind??kind,targetMin:prev?.targetMin??min,targetMax:prev?.targetMax??max,feeling:prev?.feeling??""}}
function buildExercise(t,prev){
  const ex={
    id:uid(), name:prev?.name||t.name, focus:prev?.focus||t.focus, setType:prev?.setType||t.setType,
    supersetWith:prev?.supersetWith??t.supersetWith??"", targetMin:prev?.targetMin??t.targetMin, targetMax:prev?.targetMax??t.targetMax,
    backoffMin:prev?.backoffMin??t.backoffMin??8, backoffMax:prev?.backoffMax??t.backoffMax??10, backoffPercent:prev?.backoffPercent??t.backoffPercent??12,
    note:prev?.note||t.note, alternatives:prev?.alternatives||t.alternatives||[""], activeAlternative:prev?.activeAlternative||0, sets:[]
  }
  const count=Math.min(4,prev?.sets?.length || t.sets || 3)
  for(let i=0;i<count;i++){
    let kind="normal",min=ex.targetMin,max=ex.targetMax
    if(ex.setType==="top-backoff"){kind=i===0?"top":"back";min=i===0?ex.targetMin:ex.backoffMin;max=i===0?ex.targetMax:ex.backoffMax}
    ex.sets.push(makeSet(kind,min,max,prev?.sets?.[i]))
  }
  return ex
}
function emptySession(cycle,trainingId,prev){
  const tr=DEFAULT_TRAININGS.find(x=>x.id===trainingId)
  const byName={}; if(prev)prev.exercises.forEach(e=>byName[e.name]=e)
  return {id:uid(),cycle,trainingId,trainingName:prev?.trainingName||tr.name,createdAt:new Date().toISOString(),finishedAt:"",notes:prev?.notes||"",timer:{remainingSec:3600,running:false},exercises:tr.exercises.map(e=>buildExercise(e,byName[e.name]))}
}
function getSession(c=state.currentCycle,t=state.currentTraining){
  const key=sessionKey(c,t)
  if(!state.sessions[key]){state.sessions[key]=emptySession(c,t,findPreviousSession(t,c));save()}
  return state.sessions[key]
}
function allSessions(){return Object.values(state.sessions).sort((a,b)=>a.cycle!==b.cycle?a.cycle-b.cycle:a.trainingId-b.trainingId)}
function completedInCycle(c=state.currentCycle){let n=0;for(let t=1;t<=5;t++)if(state.sessions[`C${c}_T${t}`]?.finishedAt)n++;return n}
function progressPercent(){return completedInCycle()/5*100}
function formatTime(sec){sec=Math.max(0,sec);const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,"0")}`}
function go(screen){state.currentScreen=screen;save();render()}
function setTraining(id){state.currentTraining=Number(id);getSession();save();render()}
function setCycle(c){state.currentCycle=Math.max(1,Number(c)||1);getSession();save();render()}
function nextWorkout(){let t=state.currentTraining+1,c=state.currentCycle;if(t>5){t=1;c++}state.currentTraining=t;state.currentCycle=c;getSession();save();render()}
function previousWorkout(){let t=state.currentTraining-1,c=state.currentCycle;if(t<1){if(c<=1)return;t=5;c--}state.currentTraining=t;state.currentCycle=c;getSession();save();render()}
function updateSession(field,val){getSession()[field]=val;save()}
function updateTrainingName(val){getSession().trainingName=val;save();renderSoon()}
function updateExercise(i,field,val){
  const ex=getSession().exercises[i]; ex[field]=val;
  if(field==="setType") resetSetKinds(ex);
  if(field==="backoffPercent") autoBackoff(i,true);
  save();renderSoon()
}
function resetSetKinds(ex){
  ex.sets.forEach((s,idx)=>{
    if(ex.setType==="top-backoff"){s.kind=idx===0?"top":"back";s.targetMin=idx===0?ex.targetMin:ex.backoffMin;s.targetMax=idx===0?ex.targetMax:ex.backoffMax}
    else{s.kind=ex.setType||"normal";s.targetMin=ex.targetMin;s.targetMax=ex.targetMax}
  })
}
function updateSet(i,si,field,val){
  const ex=getSession().exercises[i]; ex.sets[si][field]=val;
  if(field==="weight"&&si===0&&ex.setType==="top-backoff"&&state.settings.autoBackoff)autoBackoff(i,true);
  save()
}
function updateSetTarget(i,si,field,val){const set=getSession().exercises[i].sets[si];set[field]=Number(val);save()}
function autoBackoff(i,overwrite=false){
  const ex=getSession().exercises[i]; if(ex.setType!=="top-backoff")return;
  const top=safeNum(ex.sets[0].weight); if(top===null)return;
  const pct=safeNum(ex.backoffPercent)??12; const back=String(roundKg(top*(1-pct/100)));
  for(let si=1;si<ex.sets.length;si++){ if(overwrite||ex.sets[si].weight==="")ex.sets[si].weight=back }
}
function addSet(i){
  const ex=getSession().exercises[i]; if(ex.sets.length>=4){alert("Maximum is 4 sets.");return}
  let kind=ex.setType||"normal",min=ex.targetMin,max=ex.targetMax
  if(ex.setType==="top-backoff"){kind=ex.sets.length===0?"top":"back";min=kind==="top"?ex.targetMin:ex.backoffMin;max=kind==="top"?ex.targetMax:ex.backoffMax}
  ex.sets.push({reps:"",weight:"",kind,targetMin:min,targetMax:max,feeling:""}); autoBackoff(i,false); save();render()
}
function removeSet(i,si){const ex=getSession().exercises[i];if(ex.sets.length<=1)return;ex.sets.splice(si,1);save();render()}
function addExercise(){
  const s=getSession();
  s.exercises.push({id:uid(),name:"New Exercise",focus:"edit focus",setType:"normal",supersetWith:"",targetMin:8,targetMax:10,backoffMin:8,backoffMax:10,backoffPercent:12,note:"",alternatives:[""],activeAlternative:0,sets:[{reps:"",weight:"",kind:"normal",targetMin:8,targetMax:10,feeling:""},{reps:"",weight:"",kind:"normal",targetMin:8,targetMax:10,feeling:""},{reps:"",weight:"",kind:"normal",targetMin:8,targetMax:10,feeling:""}]});
  save();render()
}
function removeExercise(i){if(!confirm("Delete this exercise?"))return;getSession().exercises.splice(i,1);save();render()}
function addAlternative(i){getSession().exercises[i].alternatives.push("");save();render()}
function updateAlternative(i,ai,val){getSession().exercises[i].alternatives[ai]=val;save()}
function useAlternative(i,ai){
  const ex=getSession().exercises[i]; const alt=ex.alternatives[ai]; if(!alt)return;
  const old=ex.name; ex.name=alt; ex.alternatives[ai]=old; ex.activeAlternative=ai; save();render()
}
function finishWorkout(){const s=getSession();s.timer.running=false;s.finishedAt=new Date().toISOString();save();alert("Workout saved ✅");render()}
function startTimer(){getSession().timer.running=true;save();render()}
function pauseTimer(){getSession().timer.running=false;save();render()}
function resetTimer(){const s=getSession();s.timer.running=false;s.timer.remainingSec=3600;save();render()}
function resetAll(){const typed=prompt("Type RESET to delete all app data."); if(typed==="RESET"){localStorage.removeItem(STORAGE_KEY);state=initialState();render()}}
let renderTimeout=null; function renderSoon(){clearTimeout(renderTimeout);renderTimeout=setTimeout(render,50)}
function diffFromPrev(exName,setIndex,field,current){
  const prev=findPreviousSession(state.currentTraining,state.currentCycle); if(!prev)return "—"
  const ex=prev.exercises.find(e=>e.name===exName); const val=ex?.sets?.[setIndex]?.[field]
  const a=safeNum(current),b=safeNum(val); if(a===null||b===null)return "—"; const d=a-b; return `${d>0?"+":""}${d}${field==="weight"?" kg":" reps"}`
}
function renderDashboard(){
  const cards=DEFAULT_TRAININGS.map(t=>{
    const s=state.sessions[`C${state.currentCycle}_T${t.id}`]; const done=!!s?.finishedAt; const active=state.currentTraining===t.id
    return `<div class="workout-card ${done?'done':''} ${active?'active':''}">
      <div class="row space"><div class="badge pill-blue">T${t.id}</div><div class="badge ${done?'pill-green':'pill-orange'}">${done?'Done':'Pending'}</div></div>
      <div style="font-size:19px;font-weight:950;margin-top:14px">${escapeHtml(s?.trainingName||t.name)}</div>
      <div class="muted small" style="margin-top:6px">${escapeHtml(t.short)}</div>
      <button class="btn-accent" style="width:100%;margin-top:14px" onclick="setTraining(${t.id});go('workout')">Open</button>
    </div>`
  }).join("")
  return `<div class="hero">
    <div class="hero-title">5-training rotation, editable from top to bottom.</div>
    <div class="hero-text">Everything is editable: exercises, focus, notes, rep ranges, set types, alternatives, supersets and back-off percentage. Max 4 sets per exercise.</div>
  </div>
  <div class="grid three">
    <div class="metric"><div class="muted tiny">Current cycle</div><div class="big-number">${state.currentCycle}</div></div>
    <div class="metric"><div class="muted tiny">Current training</div><div class="big-number">T${state.currentTraining}</div></div>
    <div class="metric"><div class="muted tiny">Completed</div><div class="big-number">${completedInCycle()}/5</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row space"><h3>Cycle progress</h3><div class="badge">${Math.round(progressPercent())}%</div></div>
    <div class="progress"><div style="width:${progressPercent()}%"></div></div>
  </div>
  <div class="workout-cards" style="margin-top:14px">${cards}</div>`
}
function renderSet(ex,i,set,si){
  const cls=set.kind==="top"?"top":set.kind==="back"?"back":""
  const label=set.kind==="top"?"Top":set.kind==="back"?"Back":`#${si+1}`
  return `<div class="set-row">
    <div class="set-label ${cls}">${label}</div>
    <div><input type="number" inputmode="numeric" placeholder="Reps" value="${set.reps}" oninput="updateSet(${i},${si},'reps',this.value)"><div class="diff">prev: ${diffFromPrev(ex.name,si,'reps',set.reps)}</div></div>
    <div><input type="number" inputmode="decimal" placeholder="KG" value="${set.weight}" oninput="updateSet(${i},${si},'weight',this.value)"><div class="diff">prev: ${diffFromPrev(ex.name,si,'weight',set.weight)}</div></div>
    <div class="set-type">
      <div class="label" style="margin-bottom:4px">Kind</div>
      <select onchange="updateSet(${i},${si},'kind',this.value);render()">
        <option value="normal" ${set.kind==='normal'?'selected':''}>Normal</option>
        <option value="top" ${set.kind==='top'?'selected':''}>Top</option>
        <option value="back" ${set.kind==='back'?'selected':''}>Back</option>
        <option value="superset" ${set.kind==='superset'?'selected':''}>Superset</option>
        <option value="dropset" ${set.kind==='dropset'?'selected':''}>Drop set</option>
      </select>
    </div>
    <div class="set-target">
      <div class="label" style="margin-bottom:4px">Target reps</div>
      <div class="row"><input type="number" value="${set.targetMin}" onchange="updateSetTarget(${i},${si},'targetMin',this.value)"><input type="number" value="${set.targetMax}" onchange="updateSetTarget(${i},${si},'targetMax',this.value)"></div>
    </div>
    <div class="set-actions row" style="justify-content:flex-end">
      <button class="btn-small ${set.feeling==='hard'?'btn-red':'btn-outline'}" onclick="updateSet(${i},${si},'feeling','hard');render()">Hard</button>
      <button class="btn-small ${set.feeling==='good'?'btn-orange':'btn-outline'}" onclick="updateSet(${i},${si},'feeling','good');render()">OK</button>
      <button class="btn-small ${set.feeling==='easy'?'btn-green':'btn-outline'}" onclick="updateSet(${i},${si},'feeling','easy');render()">Easy</button>
      <button class="btn-outline btn-small" onclick="removeSet(${i},${si})">Remove</button>
    </div>
  </div>`
}
function renderWorkout(){
  const s=getSession()
  const cycleOpts=Array.from({length:Math.max(12,state.currentCycle+3)},(_,i)=>i+1).map(c=>`<option value="${c}" ${c===state.currentCycle?'selected':''}>Cycle ${c}</option>`).join("")
  const trainingOpts=DEFAULT_TRAININGS.map(t=>`<option value="${t.id}" ${t.id===state.currentTraining?'selected':''}>T${t.id} - ${t.name}</option>`).join("")
  const exerciseNames=s.exercises.map(e=>e.name)
  return `<div class="card">
    <div class="grid two">
      <div><div class="label">Cycle</div><select onchange="setCycle(this.value)">${cycleOpts}</select></div>
      <div><div class="label">Training</div><select onchange="setTraining(this.value)">${trainingOpts}</select></div>
    </div>
    <div style="margin-top:14px"><div class="label">Training name</div><input value="${escapeHtml(s.trainingName)}" oninput="updateTrainingName(this.value)"></div>
    <div class="row space" style="margin-top:14px">
      <div><div class="tiny muted">Current session</div><div style="font-size:24px;font-weight:950">Cycle ${state.currentCycle} · Training ${state.currentTraining}</div></div>
      <div class="badge ${s.finishedAt?'pill-green':'pill-orange'}">${s.finishedAt?'Finished':'In progress'}</div>
    </div>
    <div class="grid two" style="margin-top:14px">
      <div class="metric"><div class="label">Timer</div><div class="big-number">${formatTime(s.timer.remainingSec)}</div><div class="row" style="margin-top:12px"><button class="btn-green" onclick="startTimer()">Start</button><button class="btn-orange" onclick="pauseTimer()">Pause</button><button class="btn-outline" onclick="resetTimer()">Reset</button></div></div>
      <div><div class="label">Session notes</div><textarea oninput="updateSession('notes',this.value)" placeholder="How did this workout feel?">${escapeHtml(s.notes||"")}</textarea></div>
    </div>
    <div class="row space" style="margin-top:14px">
      <div class="row"><button class="btn-outline" onclick="previousWorkout()">Previous</button><button class="btn-purple" onclick="nextWorkout()">Next workout</button><button class="btn-accent" onclick="addExercise()">+ Exercise</button></div>
      <button class="btn-green" onclick="finishWorkout()">Finish Workout</button>
    </div>
  </div>
  ${s.exercises.map((ex,i)=>`<div class="exercise">
    <div class="exercise-head">
      <div style="flex:1;min-width:240px">
        <div class="label">Exercise ${i+1} name</div>
        <input value="${escapeHtml(ex.name)}" oninput="updateExercise(${i},'name',this.value)">
        <div class="focus-box">
          <div class="label">Focus</div>
          <textarea oninput="updateExercise(${i},'focus',this.value)">${escapeHtml(ex.focus||"")}</textarea>
        </div>
      </div>
      <div class="row">
        <div class="badge ${ex.setType==='top-backoff'?'pill-blue':''}">${escapeHtml(ex.setType)}</div>
        <button class="btn-red btn-small" onclick="removeExercise(${i})">Delete</button>
      </div>
    </div>
    <div class="grid two">
      <div><div class="label">Exercise type</div>
        <select onchange="updateExercise(${i},'setType',this.value);render()">
          <option value="normal" ${ex.setType==='normal'?'selected':''}>Normal</option>
          <option value="top-backoff" ${ex.setType==='top-backoff'?'selected':''}>Top Set + Back Off</option>
          <option value="superset" ${ex.setType==='superset'?'selected':''}>Superset</option>
          <option value="dropset" ${ex.setType==='dropset'?'selected':''}>Drop set</option>
        </select>
      </div>
      <div><div class="label">Superset with</div>
        <select onchange="updateExercise(${i},'supersetWith',this.value)">
          <option value="">None</option>
          ${exerciseNames.map(n=>`<option value="${escapeHtml(n)}" ${ex.supersetWith===n?'selected':''}>${escapeHtml(n)}</option>`).join("")}
        </select>
      </div>
      <div><div class="label">Exercise rep range</div><div class="row"><input type="number" value="${ex.targetMin}" onchange="updateExercise(${i},'targetMin',Number(this.value));resetSetKinds(getSession().exercises[${i}]);render()"><input type="number" value="${ex.targetMax}" onchange="updateExercise(${i},'targetMax',Number(this.value));resetSetKinds(getSession().exercises[${i}]);render()"></div></div>
      <div><div class="label">Back off %</div><input type="number" value="${ex.backoffPercent}" onchange="updateExercise(${i},'backoffPercent',Number(this.value))"></div>
    </div>
    <div style="margin-top:12px">
      <div class="label">Alternative exercises</div>
      ${ex.alternatives.map((alt,ai)=>`<div class="alt-grid" style="margin-bottom:8px"><input placeholder="Alternative exercise" value="${escapeHtml(alt)}" oninput="updateAlternative(${i},${ai},this.value)"><button class="btn-outline btn-small" onclick="useAlternative(${i},${ai})">Use Alt</button></div>`).join("")}
      <button class="btn-outline btn-small" onclick="addAlternative(${i})">+ Alternative</button>
    </div>
    <div style="margin-top:12px"><div class="label">Exercise note / instructions</div><textarea oninput="updateExercise(${i},'note',this.value)">${escapeHtml(ex.note||"")}</textarea></div>
    <div class="sets-wrap">
      <div class="row space"><h4>Sets</h4><button class="btn-outline btn-small" onclick="addSet(${i})">+ Set</button></div>
      <div class="hint" style="margin:8px 0">Top weight change always recalculates back-off sets when Auto Backoff is ON. Every field is still editable.</div>
      ${ex.sets.map((set,si)=>renderSet(ex,i,set,si)).join("")}
    </div>
  </div>`).join("")}`
}
function renderHistory(){
  const sessions=allSessions()
  return `<div class="card"><h3>History</h3><div class="muted">All saved cycles and trainings on this device.</div></div>
  <div class="grid" style="margin-top:14px">
    ${sessions.length?sessions.map(s=>`<div class="card">
      <div class="row space"><div><b>Cycle ${s.cycle} · Training ${s.trainingId}</b><div class="muted small">${escapeHtml(s.trainingName)}</div></div><button class="btn-outline btn-small" onclick="setCycle(${s.cycle});setTraining(${s.trainingId});go('workout')">Open</button></div>
      <div class="row" style="margin-top:10px"><span class="badge ${s.finishedAt?'pill-green':'pill-orange'}">${s.finishedAt?'Finished':'Not finished'}</span><span class="badge">${new Date(s.createdAt).toLocaleDateString()}</span></div>
    </div>`).join(""):`<div class="empty card">No history yet.</div>`}
  </div>`
}
function renderSettings(){
  return `<div class="card">
    <h3>Settings</h3>
    <div class="grid two">
      <div><div class="label">App name</div><input value="${escapeHtml(state.appName)}" oninput="state.appName=this.value;save();renderSoon()"></div>
      <div><div class="label">Auto calculate back off</div><select onchange="state.settings.autoBackoff=this.value==='true';save();render()"><option value="true" ${state.settings.autoBackoff?'selected':''}>ON</option><option value="false" ${!state.settings.autoBackoff?'selected':''}>OFF</option></select></div>
    </div>
    <div class="hint" style="margin-top:12px">Back off weights are recalculated every time top set weight changes. Maximum is 4 sets per exercise.</div>
  </div>
  <div class="danger-zone" style="margin-top:14px">
    <h3>Danger zone</h3>
    <div class="muted">This deletes all saved cycles and workout data from this device.</div>
    <button class="btn-red" style="margin-top:12px" onclick="resetAll()">Reset all data</button>
  </div>`
}
function render(){
  const s=getSession()
  document.getElementById("app").innerHTML=`<div class="topbar">
    <div class="brand">
      <div class="logo-wrap"><div class="logo">🏋️</div><div><div class="title">${escapeHtml(state.appName)}</div><div class="subtitle">Fully editable · rotation · alternatives · supersets · top/back off</div></div></div>
      <button class="chip" onclick="go('workout')">C${state.currentCycle} · T${state.currentTraining}</button>
    </div>
    <div class="nav"><button class="${state.currentScreen==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${state.currentScreen==='workout'?'active':''}" onclick="go('workout')">Workout</button><button class="${state.currentScreen==='history'?'active':''}" onclick="go('history')">History</button><button class="${state.currentScreen==='settings'?'active':''}" onclick="go('settings')">Settings</button></div>
  </div>
  <div class="screen ${state.currentScreen==='dashboard'?'active':''}">${renderDashboard()}</div>
  <div class="screen ${state.currentScreen==='workout'?'active':''}">${renderWorkout()}</div>
  <div class="screen ${state.currentScreen==='history'?'active':''}">${renderHistory()}</div>
  <div class="screen ${state.currentScreen==='settings'?'active':''}">${renderSettings()}</div>
  <div class="footer-note">Current: Cycle ${state.currentCycle} · Training ${state.currentTraining} · Timer ${formatTime(s.timer.remainingSec)} · Saved locally</div>`
}
setInterval(()=>{const s=getSession(); if(!s.timer.running)return; if(s.timer.remainingSec>0)s.timer.remainingSec--; else s.timer.running=false; save(); if(state.currentScreen==="workout")render()},1000)
render()
</script>
</body>
</html>
