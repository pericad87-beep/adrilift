<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <title>AdriLift Rotation</title>
  <style>
    :root{--bg:#070b12;--card:#121b29;--card2:#172234;--text:#eef5ff;--muted:#94a6bd;--line:#29364a;--accent:#7c3aed;--accent2:#38bdf8;--green:#22c55e;--red:#ef4444;--shadow:0 20px 55px rgba(0,0,0,.38);--radius:24px}
    *{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(circle at 12% 0%,rgba(124,58,237,.28),transparent 30%),radial-gradient(circle at 90% 8%,rgba(56,189,248,.22),transparent 30%),linear-gradient(180deg,#070b12,#0a101a 42%,#070b12);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .app{max-width:1120px;margin:0 auto;padding:16px 14px 120px}.topbar{position:sticky;top:0;z-index:20;margin:-16px -14px 16px;padding:14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,11,18,.78);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:1000;box-shadow:0 12px 28px rgba(124,58,237,.32)}
    .title{font-size:28px;font-weight:1000}.subtitle{font-size:13px;color:var(--muted);margin-top:2px}.chip,.badge{border:1px solid var(--line);background:#0c1320;color:var(--muted);border-radius:999px;padding:7px 10px;font-weight:950;font-size:12px}.chip{color:var(--text);padding:9px 12px}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.nav button,.btn{border:none;border-radius:16px;padding:12px 14px;background:#1f2b3d;color:white;font-weight:950;cursor:pointer}.nav button{background:#111a27;color:var(--muted)}.nav button.active{background:linear-gradient(135deg,rgba(124,58,237,.85),rgba(56,189,248,.55));color:white}
    @media(max-width:800px){.nav{grid-template-columns:repeat(2,1fr)}}.screen{display:none}.screen.active{display:block}.hero,.card,.exercise{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px}.hero{border-radius:30px;margin-bottom:14px}.hero-title{font-size:28px;font-weight:1000}.hero-text{font-size:14px;line-height:1.55;color:var(--muted);margin-top:6px}
    .grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){.grid.two,.grid.three{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.space{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}
    .muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}.big{font-size:24px;font-weight:1000}.label{font-size:12px;color:var(--muted);font-weight:950;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
    input,select,textarea{width:100%;border:1px solid var(--line);background:#0c1320;color:var(--text);border-radius:16px;padding:12px;outline:none}textarea{min-height:80px;resize:vertical}.btn-small{padding:8px 10px;border-radius:12px;font-size:12px}.btn-outline{background:transparent;color:var(--text);border:1px solid var(--line)}.btn-accent{background:linear-gradient(135deg,var(--accent),#4f46e5)}.btn-green{background:linear-gradient(135deg,var(--green),#16a34a)}.btn-red{background:linear-gradient(135deg,var(--red),#dc2626)}.badge.green{color:#bbf7d0;border-color:#14532d;background:#082412}.badge.purple{color:#ddd6fe;border-color:#5b21b6;background:#1d1235}
    .progress{height:10px;border-radius:999px;background:#0c1320;border:1px solid var(--line);overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.workout-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}@media(max-width:950px){.workout-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.workout-cards{grid-template-columns:1fr}}
    .workout-card{padding:14px;border-radius:22px;background:linear-gradient(180deg,#121b29,#0d1420);border:1px solid rgba(255,255,255,.08)}.workout-card.active{outline:2px solid rgba(56,189,248,.45)}.exercise{margin-top:14px;background:linear-gradient(180deg,#111a28,#0c1320)}.exercise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}.divider{height:1px;background:rgba(255,255,255,.07);margin:12px 0}
    .set-row{display:grid;grid-template-columns:64px 94px 94px 1fr 1fr 46px;gap:8px;align-items:start;margin-bottom:8px}@media(max-width:900px){.set-row{grid-template-columns:56px 1fr 1fr}.wide-mobile{grid-column:1/-1}}.set-label{border-radius:14px;background:#0b111c;border:1px solid var(--line);font-weight:1000;text-align:center;padding:12px 8px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const STORAGE_KEY="adrilift_rotation_v3";
const TRAININGS=[{id:1,title:"Trening 1",subtitle:"Grudi / Biceps"},{id:2,title:"Trening 2",subtitle:"Leđa / Triceps"},{id:3,title:"Trening 3",subtitle:"Ramena / Trap"},{id:4,title:"Trening 4",subtitle:"Grudi / Leđa"},{id:5,title:"Trening 5",subtitle:"Noge + Superset"}];
function uid(){return Math.random().toString(36).slice(2,10)}
function setObj(i,type,min,max){return {label:i===0&&type==="topbackoff"?"Top":(i>0&&type==="topbackoff"?"Back":"Set"),targetMin:i===0?min:(type==="topbackoff"?8:min),targetMax:i===0?max:(type==="topbackoff"?10:max),reps:"",weight:""}}
function ex(name,focus,type,sets,min,max,note){return {id:uid(),name,focus,type,targetMin:min,targetMax:max,note,backoffPercent:12,sets:Array.from({length:sets},(_,i)=>setObj(i,type,min,max))}}
const DEFAULT_EXERCISES={
1:[ex("Incline Smith Press","gornja grudi","topbackoff",4,6,8,"Spuštaj ka gornjem delu grudi. Laktovi blago u stranu. Top set 6–8, back off 8–10."),ex("Machine Chest Press","srednja grudi","normal",3,8,10,"Pun opseg pokreta. Ne zaključavaj laktove."),ex("Incline Fly","gornja grudi / istezanje","normal",3,10,12,"Duboko istegni dole. Kontrola."),ex("Preacher Curl","biceps","normal",3,8,10,"Lakat fiksiran. Spor negativ."),ex("Hammer Curl","brachialis / podlaktica","normal",3,10,12,"Neutral hvat. Bez ljuljanja.")],
2:[ex("Barbell Row","gornja leđa / debljina","topbackoff",4,6,8,"Vučeš šipku ka donjem stomaku. Hvat običan overhand, malo šire od ramena. Laktovi blago u stranu. Skupljaj lopatice."),ex("Lat Pulldown (uski/neutral)","lat / širina","normal",3,8,10,"Vučeš ka gornjim grudima. Laktovi uz telo. Ne vuci iza glave."),ex("Chest Supported Row","gornja leđa","normal",3,10,12,"Vučeš ka sredini stomaka. Grudi naslonjene, bez cimanja."),ex("Skull Crusher","triceps / duga glava","normal",3,8,10,"Spuštaj iza čela. Laktovi mirni."),ex("Cable Pushdown","triceps","normal",3,10,12,"Laktovi uz telo. Pun opseg."),ex("Single Arm Cable Pushdown (neutral)","triceps / kontrola","normal",2,12,15,"Jednoručno na sajli neutral hvat. Kontrola.")],
3:[ex("Lateral Raise Machine","side delt / širina ramena","normal",4,12,15,"Radi prvo jer je prioritet. Bez zamaha."),ex("Shoulder Press Machine","prednje rame + side delt","topbackoff",4,6,8,"Kontrola. Ne spuštaj preduboko i ne zaključavaj laktove."),ex("Face Pull","zadnje rame","normal",3,12,15,"Povlači ka licu. Laktovi visoko."),ex("Cable Lateral Raise","side delt izolacija","normal",3,12,15,"Kontrola, bez trzaja."),ex("Shrugs","trapez","normal",3,10,15,"Samo gore-dole. Bez kruženja.")],
4:[ex("Incline Dumbbell Press","gornja grudi","topbackoff",4,6,8,"Duboko istezanje. Kontrola. Top set + back off."),ex("T-Bar Row (uski hvat)","mix: gornja leđa + lat","topbackoff",4,6,8,"Vučeš ka stomaku. Laktovi uz telo. Lakat vodi pokret."),ex("Incline Machine Press","gornja grudi","normal",3,10,12,"Spor negativ. Stabilan položaj."),ex("Seated Cable Row (lat varijanta)","lat","normal",3,10,12,"Vučeš ka donjem stomaku / kukovima. Laktovi uz telo."),ex("Flat Machine Fly","srednja grudi / istezanje","normal",3,12,15,"Istezanje dole. Ne udaraj ručke gore."),ex("Wide Grip Cable Row","gornja leđa","normal",3,10,12,"Širok hvat. Vučeš ka grudima. Laktovi šire, skupljaj lopatice.")],
5:[ex("Squat / Hack Squat","noge / glavna vežba","topbackoff",4,6,8,"Glavna vežba. Kontrola dubine. Top set + back off."),ex("Leg Press","cela noga / kvadriceps dominant","normal",3,10,12,"Stopala stabilna. Pun opseg koji kontrolišeš."),ex("Leg Curl","zadnja loža","normal",3,10,12,"Spor negativ. Ne diži kukove."),ex("Leg Extension","kvadriceps","normal",3,12,15,"Zadrži gore sekund."),ex("Lateral Raise","side delt","normal",3,12,15,"Superset deo. Lagano."),ex("Cable Curl","biceps pump","normal",3,10,12,"Superset deo. Kontrola."),ex("Rope Pushdown","triceps","normal",3,10,12,"Superset deo. Laktovi uz telo.")]
};
function clone(v){return JSON.parse(JSON.stringify(v))}function initialState(){return {screen:"dashboard",currentTraining:1,currentCycle:1,completed:{},history:{},templates:clone(DEFAULT_EXERCISES)}}let state=load();
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):initialState()}catch(e){return initialState()}}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function key(c=state.currentCycle,t=state.currentTraining){return `c${c}_t${t}`}function prevCycleKey(){return state.currentCycle>1?`c${state.currentCycle-1}_t${state.currentTraining}`:null}
function getWorkout(c=state.currentCycle,t=state.currentTraining){const k=key(c,t);if(!state.history[k]){const prev=c>1?state.history[`c${c-1}_t${t}`]:null;state.history[k]=prev?clone(prev):clone(state.templates[t]);state.history[k].forEach(e=>e.sets.forEach(s=>{s.reps=s.reps||"";s.weight=s.weight||""}))}return state.history[k]}
function completedCount(){let c=0;for(let i=1;i<=5;i++)if(state.completed[key(state.currentCycle,i)])c++;return c}function activeTrainingLabel(){return TRAININGS.find(t=>t.id===state.currentTraining)}function go(screen){state.screen=screen;save();render()}function selectTraining(t){state.currentTraining=Number(t);getWorkout();save();render()}
function nextTraining(){state.completed[key()]=new Date().toISOString();if(state.currentTraining===5){state.currentCycle++;state.currentTraining=1}else state.currentTraining++;getWorkout();save();render()}
function updateExercise(i,field,val){getWorkout()[i][field]=val;save()}function roundToHalf(n){return Math.round(n*2)/2}function maybeAutoBackoff(i,si,val){const e=getWorkout()[i];if(e.type!=="topbackoff"||si!==0)return;const top=Number(val);if(!Number.isFinite(top)||top<=0)return;const back=roundToHalf(top*(1-Number(e.backoffPercent||12)/100));for(let j=1;j<e.sets.length;j++){if(!e.sets[j].weight)e.sets[j].weight=String(back)}}
function updateSet(i,si,field,val){getWorkout()[i].sets[si][field]=val;if(field==="weight")maybeAutoBackoff(i,si,val);save();setTimeout(render,250)}function addSet(i){const e=getWorkout()[i];e.sets.push(setObj(e.sets.length,e.type,e.targetMin,e.targetMax));save();render()}function removeSet(i,si){const e=getWorkout()[i];if(e.sets.length<=1)return;e.sets.splice(si,1);save();render()}function addExercise(){getWorkout().push(ex("New Exercise","","normal",3,8,10,""));save();render()}function removeExercise(i){getWorkout().splice(i,1);save();render()}
function previousValue(i,si,field){const pk=prevCycleKey();return pk&&state.history[pk]?.[i]?.sets?.[si]?.[field]||""}function diff(c,p,s){const a=Number(c),b=Number(p);if(!Number.isFinite(a)||!Number.isFinite(b))return "—";const d=a-b;return `${d>0?"+":""}${d}${s}`}function resetAll(){const ok=prompt("Type RESET to delete all data.");if(ok==="RESET"){localStorage.removeItem(STORAGE_KEY);state=initialState();render()}}
function render(){const app=document.getElementById("app");const active=activeTrainingLabel();app.innerHTML=`<div class="topbar"><div class="brand"><div class="logo"><div class="mark">A</div><div><div class="title">AdriLift</div><div class="subtitle">5-training rotation · top set + back off · smart carryover</div></div></div><button class="chip" onclick="go('workout')">Cycle ${state.currentCycle} · T${state.currentTraining}</button></div><div class="nav"><button class="${state.screen==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${state.screen==='workout'?'active':''}" onclick="go('workout')">Workout</button><button class="${state.screen==='history'?'active':''}" onclick="go('history')">History</button><button class="${state.screen==='settings'?'active':''}" onclick="go('settings')">Settings</button></div></div><div class="screen ${state.screen==='dashboard'?'active':''}">${renderDashboard()}</div><div class="screen ${state.screen==='workout'?'active':''}">${renderWorkout()}</div><div class="screen ${state.screen==='history'?'active':''}">${renderHistory()}</div><div class="screen ${state.screen==='settings'?'active':''}">${renderSettings()}</div><div class="footer-note">Saved locally on this device · Current: ${esc(active.title)} / ${esc(active.subtitle)}</div>`}
function renderDashboard(){const pct=completedCount()/5*100;return `<div class="hero"><div class="hero-title">Your rotation, not random weeks.</div><div class="hero-text">Track 5 workouts in a cycle. Finish all 5, then the next cycle starts and preloads the last values automatically.</div></div><div class="card"><div class="row space"><div><div class="big">Cycle ${state.currentCycle}</div><div class="muted">Progress through 5 trainings</div></div><div class="badge purple">${completedCount()}/5 done</div></div><div class="progress" style="margin-top:12px"><div style="width:${pct}%"></div></div></div><div class="workout-cards">${TRAININGS.map(t=>{const done=state.completed[key(state.currentCycle,t.id)];return `<div class="workout-card ${state.currentTraining===t.id?'active':''}"><div class="row space"><div><div class="tiny muted">Training ${t.id}</div><div style="font-size:19px;font-weight:1000">${esc(t.title)}</div></div><div class="badge ${done?'green':''}">${done?'Done':'Open'}</div></div><div class="muted small" style="margin-top:8px">${esc(t.subtitle)}</div><button class="btn btn-accent" style="margin-top:12px;width:100%" onclick="selectTraining(${t.id});go('workout')">Start / Edit</button></div>`}).join("")}</div>`}
function renderWorkout(){const active=activeTrainingLabel(),workout=getWorkout();return `<div class="card"><div class="row space"><div><div class="tiny muted">Cycle ${state.currentCycle}</div><div class="big">${esc(active.title)} – ${esc(active.subtitle)}</div></div><div class="row"><select style="width:auto" onchange="selectTraining(this.value)">${TRAININGS.map(t=>`<option value="${t.id}" ${t.id===state.currentTraining?'selected':''}>Training ${t.id}</option>`).join("")}</select><button class="btn-green btn" onclick="nextTraining()">Finish & Next</button></div></div><div class="hint" style="margin-top:10px">Top set = 6–8 reps. Back off = 8–10 reps and auto-calculated when you enter top set weight. Everything remains editable.</div></div><div class="stack">${workout.map((e,i)=>renderExercise(e,i)).join("")}</div><div class="row" style="margin-top:14px"><button class="btn btn-accent" onclick="addExercise()">+ Add Exercise</button></div>`}
function renderExercise(e,i){return `<div class="exercise"><div class="exercise-head"><div style="flex:1;min-width:240px"><input value="${esc(e.name)}" oninput="updateExercise(${i},'name',this.value)" style="font-size:18px;font-weight:950"><div class="row" style="margin-top:8px"><span class="badge purple">${e.type==="topbackoff"?"Top Set + Back Off":"Normal"}</span><span class="badge">Focus: ${esc(e.focus||"")}</span></div></div><button class="btn-red btn-small" onclick="removeExercise(${i})">Delete</button></div><div class="grid three"><div><div class="label">Focus</div><input value="${esc(e.focus||"")}" oninput="updateExercise(${i},'focus',this.value)"></div><div><div class="label">Type</div><select onchange="updateExercise(${i},'type',this.value);render()"><option value="normal" ${e.type==="normal"?'selected':''}>Normal</option><option value="topbackoff" ${e.type==="topbackoff"?'selected':''}>Top Set + Back Off</option></select></div><div><div class="label">Back off %</div><input type="number" value="${esc(e.backoffPercent||12)}" oninput="updateExercise(${i},'backoffPercent',this.value)"></div></div><div style="margin-top:10px"><div class="label">Instructions</div><textarea oninput="updateExercise(${i},'note',this.value)">${esc(e.note||"")}</textarea></div><div class="divider"></div><div class="row space"><h4 style="margin:0">Sets</h4><button class="btn-outline btn-small" onclick="addSet(${i})">+ Add Set</button></div><div style="margin-top:10px">${e.sets.map((s,si)=>renderSet(e,i,s,si)).join("")}</div></div>`}
function renderSet(e,i,s,si){const pw=previousValue(i,si,"weight"),pr=previousValue(i,si,"reps");return `<div class="set-row"><div class="set-label">${esc(s.label||("#"+(si+1)))}</div><div><input type="number" value="${esc(s.targetMin)}" oninput="getWorkout()[${i}].sets[${si}].targetMin=this.value;save()" placeholder="Min"><div class="hint">min reps</div></div><div><input type="number" value="${esc(s.targetMax)}" oninput="getWorkout()[${i}].sets[${si}].targetMax=this.value;save()" placeholder="Max"><div class="hint">max reps</div></div><div class="wide-mobile"><input type="number" inputmode="decimal" value="${esc(s.weight)}" oninput="updateSet(${i},${si},'weight',this.value)" placeholder="kg"><div class="hint">vs prev: ${diff(s.weight,pw," kg")}</div></div><div class="wide-mobile"><input type="number" value="${esc(s.reps)}" oninput="updateSet(${i},${si},'reps',this.value)" placeholder="done reps"><div class="hint">target ${esc(s.targetMin)}–${esc(s.targetMax)} · vs prev: ${diff(s.reps,pr," reps")}</div></div><button class="btn-outline btn-small" onclick="removeSet(${i},${si})">×</button></div>`}
function renderHistory(){let max=Math.max(state.currentCycle,1),cards="";for(let c=1;c<=max;c++){let done=0;for(let t=1;t<=5;t++)if(state.completed[`c${c}_t${t}`])done++;cards+=`<div class="card"><div class="row space"><div><div class="big">Cycle ${c}</div><div class="muted">${done}/5 trainings completed</div></div><button class="btn-outline btn-small" onclick="state.currentCycle=${c};state.currentTraining=1;go('dashboard')">Open</button></div><div class="progress" style="margin-top:12px"><div style="width:${done/5*100}%"></div></div></div>`}return `<div class="card"><div class="big">History</div><div class="muted">Each cycle contains all 5 trainings. New cycles preload the previous cycle automatically.</div></div><div class="grid" style="margin-top:14px">${cards}</div>`}
function renderSettings(){return `<div class="card"><div class="big">Settings</div><div class="muted">Data is saved locally in this browser/device.</div><div class="grid two" style="margin-top:14px"><button class="btn-red" onclick="resetAll()">Reset all data</button></div></div>`}
render();
</script>
</body>
</html>
